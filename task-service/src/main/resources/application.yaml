server:
  port: 8081

spring:
  application:
    name: task-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: taskflow
    password: taskflow
  jpa:
    hibernate:
      ddl-auto: update
  mvc:
    locale: en_US
    locale-resolver: fixed
jwt:
  secret: ${JWT_SECRET:a-very-secure-local-development-secret-key-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

